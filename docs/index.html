<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
      background: #0f0f0f;
      color: #e8e8e8;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 720px;
      height: 100%;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
      font-weight: 600;
      font-size: 16px;
      color: #a78bfa;
    }

    header button {
      background: none;
      border: none;
      color: #a78bfa;
      font-size: 20px;
      cursor: pointer;
      opacity: 0.7;
    }

    header button:hover { opacity: 1; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #111;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }

    .message.user {
      background: #1e1b4b;
      color: #c4b5fd;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      background: #1a1a1a;
      color: #e8e8e8;
      align-self: flex-start;
      border: 1px solid #2a2a2a;
      border-bottom-left-radius: 4px;
    }

    .message.thinking {
      background: #1a1a1a;
      color: #555;
      align-self: flex-start;
      border: 1px dashed #2a2a2a;
      font-style: italic;
    }

    #input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #161616;
      border-top: 1px solid #2a2a2a;
    }

    #userInput {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
      color: #e8e8e8;
      padding: 10px 14px;
      font-size: 14px;
      resize: none;
      font-family: inherit;
      line-height: 1.5;
    }

    #userInput:focus {
      outline: none;
      border-color: #7c3aed;
    }

    #sendBtn {
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.15s;
    }

    #sendBtn:hover:not(:disabled) { background: #6d28d9; }
    #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }

    #key-area {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #111;
      border-top: 1px solid #1e1e1e;
    }

    #key-area label {
      font-size: 12px;
      color: #555;
      white-space: nowrap;
    }

    #apiKey {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e8e8e8;
      padding: 6px 10px;
      font-size: 13px;
    }

    #apiKey:focus {
      outline: none;
      border-color: #7c3aed;
    }

    #saveKey {
      background: #2a2a2a;
      color: #e8e8e8;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    #saveKey:hover { background: #3a3a3a; }

    #keyStatus {
      font-size: 11px;
      white-space: nowrap;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <span>🤖 AI Assistant</span>
      <button id="clearBtn" title="Clear chat">↺</button>
    </header>

    <div id="messages"></div>

    <div id="input-area">
      <textarea id="userInput" placeholder="Ask anything... (Enter to send, Shift+Enter for new line)" rows="2"></textarea>
      <button id="sendBtn">Send</button>
    </div>

    <div id="key-area">
      <label>Groq API Key:</label>
      <input type="password" id="apiKey" placeholder="Paste your key here..." />
      <button id="saveKey">Save</button>
      <span id="keyStatus"></span>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "groq_api_key";
    const MODEL = "llama3-8b-8192";

    let apiKey = "";
    let messages = [];

    const messagesDiv = document.getElementById("messages");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");
    const apiKeyInput = document.getElementById("apiKey");
    const saveKeyBtn = document.getElementById("saveKey");
    const keyStatus = document.getElementById("keyStatus");

    // Load saved key from localStorage
    const savedKey = localStorage.getItem(STORAGE_KEY);
    if (savedKey) {
      apiKey = savedKey;
      apiKeyInput.value = "••••••••••••••••";
      keyStatus.textContent = "✅ Key saved";
      keyStatus.style.color = "#4ade80";
    }

    saveKeyBtn.addEventListener("click", () => {
      const val = apiKeyInput.value.trim();
      if (!val || val.startsWith("•")) return;
      apiKey = val;
      localStorage.setItem(STORAGE_KEY, val);
      apiKeyInput.value = "••••••••••••••••";
      keyStatus.textContent = "✅ Key saved";
      keyStatus.style.color = "#4ade80";
    });

    clearBtn.addEventListener("click", () => {
      messages = [];
      messagesDiv.innerHTML = "";
    });

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener("click", sendMessage);

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "message " + role;
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return div;
    }

    function setLoading(on) {
      sendBtn.disabled = on;
      sendBtn.textContent = on ? "..." : "Send";
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      if (!apiKey) {
        keyStatus.textContent = "⚠️ Enter your API key first!";
        keyStatus.style.color = "orange";
        return;
      }

      userInput.value = "";
      addMessage("user", text);
      messages.push({ role: "user", content: text });

      const thinkingDiv = addMessage("thinking", "Thinking...");
      setLoading(true);

      try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: MODEL,
            messages: [
              { role: "system", content: "You are a helpful AI assistant. Be concise and clear." },
              ...messages
            ]
          })
        });

        thinkingDiv.remove();
        const data = await res.json();

        if (!res.ok) {
          const errMsg = data.error?.message ?? "Unknown API error.";
          addMessage("assistant", "❌ Error: " + errMsg);
          messages.pop();
          return;
        }

        const reply = data.choices?.[0]?.message?.content ?? "No response.";
        messages.push({ role: "assistant", content: reply });
        addMessage("assistant", reply);

      } catch (e) {
        thinkingDiv.remove();
        addMessage("assistant", "❌ Could not reach the API. You may be blocked by the network filter.");
        messages.pop();
      } finally {
        setLoading(false);
        userInput.focus();
      }
    }
  </script>
</body>
</html>
